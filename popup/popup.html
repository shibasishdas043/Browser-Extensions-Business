<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenWeb</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body class="zw-body">
  <div class="zw-app">

    <!-- Top Bar -->
    <header class="zw-topbar">
      <div class="zw-brand">
        <div class="zw-shield-mini">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L3 6.5V12c0 5.25 3.75 10.15 9 11.35C17.25 22.15 21 17.25 21 12V6.5L12 2z" fill="url(#g1)"/>
            <path d="M9 12l2 2 4-4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="g1" x1="3" y1="2" x2="21" y2="23" gradientUnits="userSpaceOnUse">
                <stop stop-color="#00ff87"/><stop offset="1" stop-color="#00cfff"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span class="zw-wordmark">ZenWeb</span>
      </div>
      <div class="zw-actions">
        <button class="zw-icon-btn" id="zw-btn-refresh" title="Rescan page">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
        <button class="zw-icon-btn" id="zw-btn-settings" title="Full settings">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Full Hero -->
    <section class="zw-hero">
      <div class="zw-glow zw-glow--tl" aria-hidden="true"></div>
      <div class="zw-glow zw-glow--br" aria-hidden="true"></div>

      <!-- Ring + Counter -->
      <div class="zw-ring-wrap">
        <svg class="zw-ring-svg" viewBox="0 0 170 170" width="170" height="170">
          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00ff87"/>
              <stop offset="100%" stop-color="#00cfff"/>
            </linearGradient>
          </defs>
          <circle class="zw-ring-track" cx="85" cy="85" r="67"/>
          <circle class="zw-ring-fill" id="zw-ring-fill" cx="85" cy="85" r="67"/>
        </svg>
        <div class="zw-ring-center" id="zw-ring-center">
          <span class="zw-big-num" id="hero-blocked-total">0</span>
          <span class="zw-big-label" id="hero-blocked-label">INTERCEPTED</span>
        </div>
      </div>

      <!-- Domain + Time -->
      <div class="zw-meta-row">
        <div class="zw-domain-pill">
          <span class="zw-live-dot" id="zw-live-dot"></span>
          <span class="zw-domain-text" id="zw-page-domain">Active session</span>
        </div>
        <span class="zw-time-badge" id="hero-time-saved">—</span>
      </div>

      <div class="zw-sep"></div>

      <!-- Master Toggle — ABOVE the animated spotlight -->
      <div class="zw-toggle-section">
        <div class="zw-toggle-label">
          <span class="zw-toggle-title" id="zw-toggle-title">All Protections ON</span>
          <span class="zw-toggle-sub" id="zw-toggle-sub">7 shields active</span>
        </div>
        <button class="zw-toggle-btn" id="zw-master-toggle" aria-pressed="true">
          <span class="zw-toggle-thumb"></span>
        </button>
      </div>

      <div class="zw-sep" style="margin-top:10px"></div>

      <!-- Spotlight: one stat at a time — fills remaining space -->
      <div class="zw-spotlight" id="zw-spotlight" aria-live="polite">
        <div class="zw-spot-card" id="zw-spot-card">
          <span class="zw-spot-icon" id="zw-spot-icon">🔍</span>
          <div class="zw-spot-body">
            <span class="zw-spot-label" id="zw-spot-label">SEO Spam Filtered</span>
            <span class="zw-spot-count" id="zw-spot-count">0</span>
          </div>
        </div>
        <div class="zw-dots" id="zw-dots" role="tablist">
          <span class="zw-dot zw-dot--active" data-i="0"></span>
          <span class="zw-dot" data-i="1"></span>
          <span class="zw-dot" data-i="2"></span>
          <span class="zw-dot" data-i="3"></span>
          <span class="zw-dot" data-i="4"></span>
          <span class="zw-dot" data-i="5"></span>
          <span class="zw-dot" data-i="6"></span>
        </div>
      </div>

      <!-- Donation -->
      <div class="zw-donation">
        <span class="zw-donation-icon">☕</span>
        <div class="zw-donation-text">
          <span class="zw-donation-title">Enjoying ZenWeb?</span>
          <span class="zw-donation-sub">Support development</span>
        </div>
        <a class="zw-donate-btn" id="zw-btn-donate" href="#">Donate</a>
      </div>

    </section>

    <!-- Footer — standalone flat bar OUTSIDE hero -->
    <footer class="zw-footer">
      <div class="zw-footer-loc">
        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span class="zw-footer-version">v1.0.0</span>
      </div>
      <span class="zw-footer-brand">ZenWeb · On-Device Privacy</span>
      <span class="zw-footer-slot"><!-- fill later --></span>
    </footer>

  </div>


  <div class="zw-toast" id="zw-toast"><span id="zw-toast-message"></span></div>
  <script type="module" src="./ui.ts"></script>
</body>
</html>
